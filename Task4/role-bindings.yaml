# Security Officer (cluster role)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: security-officer-binding
subjects:
  - kind: ServiceAccount
    name: security-officer
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: security-officer-role
  apiGroup: rbac.authorization.k8s.io
