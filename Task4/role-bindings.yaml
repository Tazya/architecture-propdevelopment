# Product Owner
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: product-owner-binding
  namespace: product-team
subjects:
  - kind: ServiceAccount
    name: product-owner
    namespace: product-team
roleRef:
  kind: Role
  name: product-owner-role
  apiGroup: rbac.authorization.k8s.io

