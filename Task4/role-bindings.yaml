# DevOps (cluster role)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devops-cluster-binding
subjects:
  - kind: ServiceAccount
    name: devops
    namespace: product-team
roleRef:
  kind: ClusterRole
  name: devops-cluster-role
  apiGroup: rbac.authorization.k8s.io

